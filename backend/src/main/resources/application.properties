spring.application.name=ratiolab

# Optional local .env file in the working directory (repository root). It is git-ignored.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (start locally with: docker compose up -d). Development defaults, overridable via environment.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ratiolab}
spring.datasource.username=${POSTGRES_USER:ratiolab}
spring.datasource.password=${POSTGRES_PASSWORD:ratiolab}

# Tables are created only by Flyway; Hibernate just checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Directory for raw provider responses kept for provenance (git-ignored), relative to the working directory.
ratiolab.data-dir=local-data

# Supported companies: real U.S.-listed SEC filers.
ratiolab.companies=AAPL,MSFT

# Alpha Vantage. The key comes only from the environment or .env, never from this file.
ratiolab.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
ratiolab.alpha-vantage.base-url=https://www.alphavantage.co
ratiolab.alpha-vantage.connect-timeout=5s
ratiolab.alpha-vantage.read-timeout=30s
