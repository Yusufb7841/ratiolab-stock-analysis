# Local PostgreSQL for RatioLab development: docker compose up -d
# Only reachable from this computer (127.0.0.1). The development credentials below are not secrets;
# they can be overridden through environment variables or a local .env file.
name: ratiolab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ratiolab}
      POSTGRES_USER: ${POSTGRES_USER:-ratiolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratiolab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # 5433 by default, so it does not clash with other local PostgreSQL instances
    volumes:
      - ratiolab-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ratiolab-db:
